[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "english-trainer-ai"
dynamic = ["version"]
description = "Offline-first English trainer with CLI/TUI, spaced repetition, progress tracking and a local RAG tutor."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yasmin Oliveira" }]
requires-python = ">=3.11"
keywords = ["english", "language-learning", "spaced-repetition", "rag", "ollama", "qdrant", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "requests>=2.31,<3",
    "python-dotenv>=1.0",
    "qdrant-client>=1.9,<2",
    "textual>=0.50",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
audio = ["edge-tts>=7.0", "pygame>=2.6"]
huggingface = ["huggingface_hub>=0.34,<1.0"]
all = ["english-trainer-ai[audio,huggingface]"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "pre-commit>=3.7",
]

[project.scripts]
english-trainer = "english_trainer.__main__:main"

[project.urls]
Repository = "https://github.com/YasminMi/english-trainer-ai"
Issues = "https://github.com/YasminMi/english-trainer-ai/issues"

[tool.hatch.version]
path = "src/english_trainer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/english_trainer"]

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error::DeprecationWarning:english_trainer.*"]

[tool.coverage.run]
source = ["english_trainer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
    "PTH",      # prefer pathlib
    "RET",      # return statements
    "PL",       # pylint subset
    "TID",      # tidy imports
    "BLE",      # blind except
    "S",        # bandit security
]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", # complexity is tracked in review, not per-line
    "PLR2004",  # magic values are common in scoring heuristics
    "RUF001", "RUF002", "RUF003", # Portuguese text legitimately contains ambiguous glyphs
    "S311",     # random is used for study item selection, not cryptography
    "PLC0415",  # optional dependencies (textual, qdrant, pygame) are imported lazily on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true
