name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" --group dev

      - name: Check syntax and imports
        run: |
          python -m compileall -q src
          python -c "import english_trainer.__main__, english_trainer.interfaces.cli, english_trainer.interfaces.tui.app"

      - name: Lint, type-check and validate content
        if: matrix.os == 'ubuntu-latest'
        run: |
          ruff check .
          ruff format --check .
          mypy
          english-trainer validate-content

      - name: Run tests
        run: python -m pytest -q
